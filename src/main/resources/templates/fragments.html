<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Shared page shell (Member 4). Templates in this app are standalone HTML files that include this fragment
  via th:replace. Tailwind is loaded from the CDN (project rule: no bundler). Client-side JS is limited to
  essential presentation (the application modal open/close).
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' · ResearchMatch'">ResearchMatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>

<body>

<!-- Top navigation + one-click demo role switcher. -->
<header th:fragment="nav" class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
        <a th:href="@{/}" class="flex items-center gap-2 font-semibold text-slate-800">
            <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-white text-sm">RM</span>
            <span>ResearchMatch</span>
        </a>

        <nav class="flex items-center gap-1 text-sm">
            <a th:if="${isStudentView}" th:href="@{/discover}"
               class="px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100 hover:text-slate-900">Discover</a>
            <a th:if="${isStudentView}" th:href="@{/profile}"
               class="px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100 hover:text-slate-900">My Profile</a>
            <a th:unless="${isStudentView}" th:href="@{/professor}"
               class="px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100 hover:text-slate-900">Dashboard</a>
        </nav>

        <form th:action="@{/switch-role}" method="post" class="flex items-center gap-2">
            <span class="hidden sm:inline text-xs uppercase tracking-wide text-slate-400">Demo role</span>
            <div class="inline-flex rounded-lg border border-slate-300 overflow-hidden text-sm">
                <button type="submit" name="role" value="STUDENT"
                        th:classappend="${isStudentView} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-50'"
                        class="px-3 py-1.5">Student</button>
                <button type="submit" name="role" value="PROFESSOR"
                        th:classappend="${!isStudentView} ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-50'"
                        class="px-3 py-1.5 border-l border-slate-300">Professor</button>
            </div>
        </form>
    </div>
</header>

<!-- Flash / validation / error messages. -->
<section th:fragment="flash" class="max-w-6xl mx-auto px-4 pt-4 space-y-2">
    <div th:if="${successMessage}" th:text="${successMessage}"
         class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-2 text-sm text-emerald-800"></div>
    <div th:if="${infoMessage}" th:text="${infoMessage}"
         class="rounded-lg border border-sky-200 bg-sky-50 px-4 py-2 text-sm text-sky-800"></div>
    <div th:if="${errorMessage}" th:text="${errorMessage}"
         class="rounded-lg border border-rose-200 bg-rose-50 px-4 py-2 text-sm text-rose-800" role="alert"></div>
</section>

<footer th:fragment="footer" class="max-w-6xl mx-auto px-4 py-10 text-xs text-slate-400">
    ResearchMatch — CS3383 demo build. Data is seeded and stored in-memory.
</footer>

</body>
</html>
